<script>
    resizeStream();
    window.onresize=resizeStream;
    function resizeStream() {
        let windowWidth = window.innerWidth;
        if (windowWidth>980) {
            let streamWidth = windowWidth/(2.3);
            let streamHeight = streamWidth*1080/1920;
            $('#stream').width(streamWidth);
            $('#stream').height(streamHeight);
            {#console.log(window.innerHeight/window.innerWidth)#}
        }

    }
</script>
