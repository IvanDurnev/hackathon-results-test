<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link href="{{ url_for("static", filename="bootstrap-4.5.0-dist/css/bootstrap.min.css") }}" rel="stylesheet" type="text/css">
<link href="{{ url_for("static", filename="css/signin.css") }}" rel="stylesheet">
<link href="{{ url_for("static", filename="css/style.css") }}" rel="stylesheet" type="text/css">
<link rel="icon" href="{{ url_for("static", filename="images/favicon.png") }}">

<style>
    @font-face {
        font-family: 'RostelecomBasis';
        src: url("{{ url_for('static', filename='fonts/rtm/RostelecomBasis-Regular.otf') }}");
        font-weight: normal;
        font-style: normal;
    }
    @font-face {
        font-family: 'RostelecomBasis';
        src: url("{{ url_for('static', filename='fonts/rtm/RostelecomBasis-Bold.otf') }}");
        font-weight: bold;
        font-style: normal;
    }

    body{
        background-image: url('{{ url_for('static', filename='images/login_background.png') }}');
        background-size: cover;
        font-family: "RostelecomBasis";
    }

    form {
        border-radius: 10px;
        background-color: rgba(65, 166, 235, 0.502);
    }

    .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    @media (min-width: 768px) {
        .bd-placeholder-img-lg {
            font-size: 3.5rem;
        }
    }
</style>

{% block title %}
    {% if title %}
        <title>{{ title }}</title>
    {% else %}
        <title>Онлайн-маркетинг в туризме</title>
    {% endif %}
{% endblock %}

<body>
{% block content %}
{% endblock %}
